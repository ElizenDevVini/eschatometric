<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">

<title>Eschatometric Research</title>
<style>
:root{--bg:#000;--ink:#d9d9d9;--dim:#4a4a4a;--olive:#b7b76a}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--ink);font:12px/1.6 "IBM Plex Mono","Courier New",monospace;overflow-x:hidden}
body{min-height:340vh;position:relative}
h1{position:absolute;top:18px;left:22px;margin:0;font-size:11px;font-weight:normal;letter-spacing:.14em;color:var(--dim)}
figure{position:absolute;top:22vh;left:8vw;margin:0;width:min(34vw,320px)}
figure img{width:100%;height:auto;image-rendering:pixelated;display:block}
figcaption{color:var(--dim);font-size:10px;margin-top:10px;letter-spacing:.2em}
.s{position:absolute;color:var(--ink);font-size:22px;line-height:1;opacity:0;transition:opacity .01s steps(1)}
.s canvas{display:block;image-rendering:pixelated}
.s,figure img,h1{cursor:pointer}
.box{position:absolute;z-index:5;background:#000;border:1px solid #3a3a3a;color:var(--ink);font-size:10px;line-height:1.5;letter-spacing:.08em;padding:8px 10px;min-width:140px;max-width:240px;white-space:pre;overflow:hidden}
.box .x{position:absolute;top:2px;right:6px;color:var(--dim);cursor:pointer}
.box canvas{display:block;image-rendering:pixelated}
.box .d{color:var(--dim)}
.s.on{opacity:1}
.s.d{color:var(--dim)}
.s.b{font-size:44px}
.s.t{font-size:10px;letter-spacing:.3em;color:var(--dim)}
.k{position:absolute;color:var(--dim);font-size:10px;letter-spacing:.3em}
#end{position:absolute;bottom:14vh;right:12vw;color:var(--dim);font-size:10px;letter-spacing:.3em}
#end b{display:inline-block;width:6px;height:11px;background:var(--ink);vertical-align:-2px;animation:bl 1s steps(1) infinite}
@keyframes bl{50%{opacity:0}}
@media (max-width:600px){figure{width:60vw;left:6vw}.s.b{font-size:32px}}
</style>
</head>
<body>
<h1>eschatometric research</h1>

<div id="end">&mdash; <b></b></div>
<script>
var seed=11;function rnd(){seed=(seed*16807)%2147483647;return seed/2147483647}
function rot(el){
  if(el.classList.contains('t'))return;
  var ch=el.textContent,big=el.classList.contains('b'),n=big?56:30,sc=2;
  var c=document.createElement('canvas');c.width=n;c.height=n;var x=c.getContext('2d');
  x.fillStyle='#000';x.fillRect(0,0,n,n);
  x.fillStyle='#fff';x.font=(n*0.9)+'px serif';x.textAlign='center';x.textBaseline='middle';
  x.translate(n/2,n/2);x.rotate((rnd()-.5)*.5);x.transform(1,(rnd()-.5)*.4,(rnd()-.5)*.3,1,0,0);x.fillText(ch,0,1);
  var d=x.getImageData(0,0,n,n),p=d.data;
  for(var i=0;i<p.length;i+=4){
    var on=p[i]>110;
    if(on&&rnd()<.12)on=false;
    if(!on&&rnd()<.006)on=true;
    var v=on?(el.classList.contains('d')?0x4a:0xd9):0;
    p[i]=p[i+1]=p[i+2]=v;p[i+3]=on?255:0;
  }
  x.setTransform(1,0,0,1,0,0);x.clearRect(0,0,n,n);x.putImageData(d,0,0);
  c.style.width=(n*sc)+'px';c.style.height=(n*sc)+'px';
  el.textContent='';el.appendChild(c);
}
var el=[].slice.call(document.querySelectorAll('.s'));el.forEach(rot);
function r(){var h=innerHeight;el=el.filter(function(s){if(s.getBoundingClientRect().top<h*.9){s.classList.add('on');return false}return true})}
addEventListener('scroll',r,{passive:true});addEventListener('resize',r);r();

/* boxes */
var open=null,timer=null;
var WORDS='murmerge|oddue|thanatochron|ultima|penult|aqueduct|ninthstroke|zerohour|swallow|pleroma|keystone|vortex|nullsignal|codastress|isotrope|lastdrop|apoptos|omegaform|dryrun|hail'.split('|');
var RUNES='ᚠᚢᚦᚨᚱᚲᚷᚹᚺᚾᛁᛃᛇᛈᛉᛊᛏᛒᛖᛗᛚᛜᛞᛟ';
function pad(n){return (n<10?'0':'')+n}
var kinds=[
 function count(b,k){var t=Date.UTC(2031+k%9,k%12,1+k%27)+k*7919e3;function tick(){var d=Math.max(0,t-Date.now()),s=Math.floor(d/1e3);b.textContent='remaining\n'+Math.floor(s/86400)+'d '+pad(Math.floor(s%86400/3600))+':'+pad(Math.floor(s%3600/60))+':'+pad(s%60)+'\n\n'+'to what'}tick();timer=setInterval(tick,1000)},
 function noise(b,k){var c=document.createElement('canvas'),n=48;c.width=c.height=n;c.style.width=c.style.height='96px';b.appendChild(c);var x=c.getContext('2d'),im=x.createImageData(n,n),p=im.data,th=0.98,f=0;function step(){f++;for(var y=0;y<n;y++)for(var i=0;i<n;i++){var dx=i-n/2,dy=y-n/2,rr=Math.sqrt(dx*dx+dy*dy)/(n/2),on=Math.random()>(rr<.7&&rr>.6?th-.6:th),o=(y*n+i)*4;p[o]=p[o+1]=p[o+2]=on?0xd9:0;p[o+3]=255}x.putImageData(im,0,0);th=Math.max(.5,.98-f*.004)}step();timer=setInterval(step,90)},
 function words(b,k){var out=[];for(var i=0;i<6;i++)out.push(pad(i+1)+'  '+WORDS[(k*3+i*5)%WORDS.length]);b.textContent=out.join('\n');var j=0;timer=setInterval(function(){j++;var i=(k+j)%6;out[i]=pad(i+1)+'  '+WORDS[(k*3+i*5+j)%WORDS.length];b.textContent=out.join('\n')},1400)},
 function spiral(b,k){var w=22,h=9,ph=0;function draw(){var g=[];for(var y=0;y<h;y++){var row='';for(var i=0;i<w;i++){var dx=(i-w/2)/(w/2),dy=(y-h/2)/(h/2),a=Math.atan2(dy,dx),d=Math.sqrt(dx*dx+dy*dy);row+=(Math.sin(d*7-a*2+ph)>.55&&d<1)?'#':(Math.sin(d*7-a*2+ph)>.3&&d<1?'.':' ')}g.push(row)}b.textContent=g.join('\n')}draw();timer=setInterval(function(){ph+=.35;draw()},120)},
 function seq(b,k){var a=[k*13%97,k*31%89,k*7%83,k*29%79];function draw(){b.textContent=a.map(function(v,i){return ['surge','hold','sink','rest'][i]+'  '+String(v).padStart(3,' ')}).join('\n')+'\n\n'+a.reduce(function(x,y){return x+y})}draw();timer=setInterval(function(){var i=Math.floor(Math.random()*4);a[i]=(a[i]+(Math.random()<.5?-1:1)+100)%100;draw()},600)},
 function coords(b,k){var la=-(k*7.31%90),lo=(k*23.7%360)-180,br=k*37%360;function draw(){b.textContent='lat  '+la.toFixed(4)+'\nlon  '+lo.toFixed(4)+'\nbrg  '+pad(Math.floor(br))+'°\ndepth  '+(k*412%9000+1000)+' m\n\n'+'<span class="d">signal lost</span>';b.innerHTML=b.textContent}draw();timer=setInterval(function(){la-=.0007;lo+=.0011;br=(br+.4)%360;draw()},200)},
 function runes(b,k){var n=18,s='';for(var i=0;i<n;i++)s+=RUNES[(k*5+i*7)%RUNES.length];function draw(){b.textContent=s.slice(0,9)+'\n'+s.slice(9)}draw();timer=setInterval(function(){var i=Math.floor(Math.random()*n);s=s.slice(0,i)+RUNES[Math.floor(Math.random()*RUNES.length)]+s.slice(i+1);draw()},350)},
 function plate(b,k){var c=document.createElement('canvas'),n=64;c.width=c.height=n;c.style.width=c.style.height='128px';b.appendChild(c);var x=c.getContext('2d'),img=document.querySelector('figure img');var sx=(k*97)%(448-n*2),sy=(k*131)%(600-n*2);x.imageSmoothingEnabled=false;x.drawImage(img,sx,sy,n*2,n*2,0,0,n,n);var d=x.getImageData(0,0,n,n),p=d.data;for(var i=0;i<p.length;i+=4){var on=p[i]>128;if(Math.random()<.04)on=!on;p[i]=p[i+1]=p[i+2]=on?0xd9:0}x.putImageData(d,0,0);var t=document.createElement('div');t.className='d';t.textContent='fig. '+k+'  ('+sx+','+sy+')';b.appendChild(t)}
];
function close(){if(open){open.remove();open=null}if(timer){clearInterval(timer);timer=null}}
function openBox(anchor,k){
  close();
  var b=document.createElement('div');b.className='box';
  var x=document.createElement('span');x.className='x';x.textContent='×';x.onclick=close;
  var body=document.createElement('div');b.appendChild(x);b.appendChild(body);
  var rct=anchor.getBoundingClientRect(),left=rct.left+scrollX+rct.width+14,top=rct.top+scrollY-6;
  if(left+250>innerWidth)left=rct.left+scrollX-254;if(left<8)left=8;
  b.style.left=left+'px';b.style.top=top+'px';
  document.body.appendChild(b);open=b;
  kinds[k%kinds.length](body,k);
}
document.querySelectorAll('.s').forEach(function(s){s.addEventListener('click',function(e){e.stopPropagation();var k=+s.dataset.k;if(open&&open.dataset.k==k){close();return}openBox(s,k);open.dataset.k=k})});
document.querySelector('figure img').addEventListener('click',function(e){e.stopPropagation();openBox(this,7+8*Math.floor(Math.random()*3))});
document.querySelector('h1').addEventListener('click',function(e){e.stopPropagation();openBox(this,4)});
document.addEventListener('click',function(e){if(open&&!open.contains(e.target))close()});
</script>
